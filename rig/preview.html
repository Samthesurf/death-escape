<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{background:var(--card);color:var(--foreground);font-family:inherit;padding:16px}
  .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .card{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--card)}
  h3{margin:0 0 8px 0;font-size:14px}
  p{color:var(--muted-foreground);font-size:12px;max-width:520px}
  button{cursor:pointer}
  .btnrow{display:flex;gap:8px;margin-top:8px;align-items:center}
  input[type=range]{width:140px}
</style>
</head><body>
<div class="row">
  <div class="card">
    <h3>Runner rig - game view (scrolling paper)</h3>
    <svg id="game" width="640" height="300" viewBox="0 0 640 300"></svg>
    <div class="btnrow">
      <button data-hermes-send="pause runner">Pause</button>
      <button data-hermes-send="play runner">Play</button>
      <label style="font-size:12px">fps <input id="fps" type="range" min="6" max="16" value="13" step="1"><span id="fpsv">13</span></label>
    </div>
  </div>
</div>
<div style="margin-top:16px;max-width:730px">
  <div class="card">
    <h3>Keys 1-8 (frozen poses)</h3>
    <svg id="keys" width="680" height="180" viewBox="0 0 680 180"></svg>
    <p>8 keys loop: contact, push-off, passing, flight, mirrored. Hips ride high, lowest foot plants each key. Arms oppose legs.</p>
  </div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const PAPER='#fbf9f3', INK='#2e2c28';

// 8-key run cycle. Angles deg. Thigh 0=down, +=fwd. Knee +=fold backward. Shoulder 0=down, +=fwd. Elbow +=fold.
const KEYS=[
 {hipX:-8, lean:14, rT: 36,rK: 14, lT:-32,lK: 28, rS:-28,rE: 55, lS: 30,lE: 50}, // R contact
 {hipX:6,  lean:16, rT: -8,rK: 12, lT:-52,lK: 10, rS: -2,rE: 55, lS:  6,lE: 55}, // R stance
 {hipX:12, lean:18, rT:  6,rK: 12, lT: 28,lK:115, rS: 22,rE: 50, lS:-20,lE: 60}, // L swing-through
 {hipX:2,  lean:16, rT:-35,rK: 30, lT: 34,lK: 14, rS: 30,rE: 50, lS:-28,lE: 55}, // L plant
 {hipX:-8, lean:14, rT:-32,rK: 28, lT: 36,lK: 14, rS: 30,rE: 50, lS:-28,lE: 55}, // L contact
 {hipX:6,  lean:16, rT:-52,rK: 10, lT: -8,lK: 12, rS:  6,rE: 55, lS: -2,lE: 55}, // L stance
 {hipX:12, lean:18, rT: 28,rK:115, lT:  6,lK: 12, rS:-20,rE: 60, lS: 22,lE: 50}, // R swing-through
 {hipX:2,  lean:16, rT: 34,rK: 14, lT:-35,lK: 30, rS:-28,rE: 55, lS: 30,lE: 50}, // R plant
];
const CLEAR=[-2,-2,0,6,-2,-2,0,6]; // stance presses in, plant arrives, swing skims
const L={thigh:44,shin:42,torso:52,head:13,ua:32,fa:28};

function lerp(a,b,t){return a+(b-a)*t;}
// Non-uniform timing: ground contact is a snap, air gets the time.
const DUR=[0.5,0.7,1.0,1.3,0.5,0.7,1.0,1.3];
const TOTAL=DUR.reduce((a,b)=>a+b,0);
function segAt(t){
  t=((t%TOTAL)+TOTAL)%TOTAL;
  let i=0; while(t>DUR[i]){t-=DUR[i];i=(i+1)%DUR.length;}
  return [i,t/DUR[i]];
}
function poseAt(t){
  const [i,f]=segAt(t), n=KEYS.length, A=KEYS[i], B=KEYS[(i+1)%n];
  const o={}; for(const k in A) o[k]=lerp(A[k],B[k],f);
  return o;
}
function joints(p,hx,hy){
  const lean=p.lean*Math.PI/180;
  const shx=hx+Math.sin(lean)*L.torso, shy=hy-L.torso*Math.cos(lean);
  const headx=shx+Math.sin(lean)*12.5, heady=shy-Math.cos(lean)*12.5;
  function leg(thigh,knee){
    const a=thigh*Math.PI/180, k=knee*Math.PI/180;
    const kx=hx+Math.sin(a)*L.thigh, ky=hy+Math.cos(a)*L.thigh;
    const sa=a-k; // shin folds backward
    const fx=kx+Math.sin(sa)*L.shin, fy=ky+Math.cos(sa)*L.shin;
    return {k:[kx,ky],f:[fx,fy]};
  }
  function arm(thigh,elb){
    const a=thigh*Math.PI/180, e=elb*Math.PI/180;
    const ex=shx+Math.sin(a)*L.ua, ey=shy+Math.cos(a)*L.ua;
    const sa=a+e; // elbow folds forward
    const hx2=ex+Math.sin(sa)*L.fa, hy2=ey+Math.cos(sa)*L.fa;
    return {e:[ex,ey],h:[hx2,hy2]};
  }
  return {sh:[shx,shy],head:[headx,heady],r:leg(p.rT,p.rK),l:leg(p.lT,p.lK),ra:arm(p.rS,p.rE),la:arm(p.lS,p.lE)};
}
function defs(svg){
  const d=el('defs',{},svg);
  const f=el('filter',{id:'rough'+svg.id,x:'-20%',y:'-20%',width:'140%',height:'140%'},d);
  el('feTurbulence',{type:'fractalNoise',baseFrequency:'0.035',numOctaves:'2',seed:'7',result:'n'},f);
  el('feDisplacementMap',{in:'SourceGraphic',in2:'n',scale:'2.2'},f);
  const f2=el('filter',{id:'roughBg'+svg.id,x:'-20%',y:'-20%',width:'140%',height:'140%'},d);
  el('feTurbulence',{type:'fractalNoise',baseFrequency:'0.012',numOctaves:'2',seed:'3',result:'n2'},f2);
  el('feDisplacementMap',{in:'SourceGraphic',in2:'n2',scale:'3'},f2);
}
function paper(svg,W,H,scroll){
  el('rect',{x:0,y:0,width:W,height:H,fill:PAPER},svg);
  // ruled lines: perfectly straight, never through the rough filter
  const g=el('g',{stroke:'#c9d4e8','stroke-width':1,opacity:.8},svg);
  for(let y=40;y<H;y+=36){el('line',{x1:0,y1:y,x2:W,y2:y},g);}
  // ground: perfectly straight
  const gy=H-56;
  const gg=el('g',{},svg);
  el('line',{x1:-40,y1:gy,x2:W+40,y2:gy,stroke:INK,'stroke-width':3.4,'stroke-linecap':'round'},gg);
  el('line',{x1:-40,y1:gy+7,x2:W+40,y2:gy+7,stroke:INK,'stroke-width':1.4,opacity:.35,'stroke-linecap':'round'},gg);
  // scrolling grass ticks + clouds
  const t=el('g',{stroke:INK,'stroke-width':2,opacity:.55,filter:'url(#rough'+svg.id+')'},svg);
  for(let i=0;i<14;i++){
    const x=((i*173 - scroll*2)%(W+80)+W+80)%(W+80)-40;
    const h=6+(i*37%10);
    el('line',{x1:x,y1:gy,x2:x+5,y2:gy-h},t);
    el('line',{x1:x+7,y1:gy,x2:x+10,y2:gy-h-3},t);
  }
  return gy;
}
function speedlines(g,behindX,midY,phase){
  // 3 arcs behind runner, subtle pulse with stride, never strobing randomly
  for(let i=0;i<3;i++){
    const y=midY-34+i*30;
    const len=44+((phase*6+i*2)%3)*6;
    el('path',{d:`M ${behindX-len} ${y} q 20 -4 ${len} 2`,fill:'none',stroke:INK,'stroke-width':2,opacity:.4,'stroke-linecap':'round'},g);
  }
}
function drawFigure(svg,J,s){
  // No SVG turbulence filter here on purpose: a static noise field makes
  // moving lines boil. Wobble is baked into the geometry with a fixed seed,
  // identical every frame, so lines stay stable in motion.
  const g=el('g',{stroke:INK,'stroke-width':3.4,'stroke-linecap':'round','stroke-linejoin':'round',fill:'none'},svg);
  const [hx,hy]=J.hip,[shx,shy]=J.sh;
  let seed=7;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff*2-1;};
  function wob(parent,A,B,w,extra){
    const dx=B[0]-A[0], dy=B[1]-A[1], l=Math.hypot(dx,dy)||1;
    const nx=-dy/l, ny=dx/l, j1=rnd()*1.0, j2=rnd()*1.0;
    const P=[A,[A[0]*.75+B[0]*.25+nx*j1,A[1]*.75+B[1]*.25+ny*j1],
               [A[0]*.25+B[0]*.75+nx*j2,A[1]*.25+B[1]*.75+ny*j2],B];
    const a={points:P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),
             fill:'none',stroke:INK,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'};
    if(extra)for(const k in extra)a[k]=extra[k];
    el('polyline',a,parent);
  }
  const far=el('g',{opacity:.62},g);
  wob(far,[hx,hy],J.l.k,3.4); wob(far,J.l.k,J.l.f,3.4);
  wob(far,J.sh,J.la.e,3.4); wob(far,J.la.e,J.la.h,3.4);
  // torso
  wob(g,[hx,hy],[shx,shy],3.8);
  // near limbs
  wob(g,[hx,hy],J.r.k,3.4); wob(g,J.r.k,J.r.f,3.4);
  wob(g,[shx,shy],J.ra.e,3.4); wob(g,J.ra.e,J.ra.h,3.4);
  // feet nubs
  for(const F of [J.r.f,J.l.f]) el('line',{x1:F[0]-5,y1:F[1],x2:F[0]+5,y2:F[1],'stroke-width':3},g);
  // hands
  for(const H of [J.ra.h,J.la.h]) el('circle',{cx:H[0],cy:H[1],r:2.6,fill:INK,stroke:'none'},g);
  // joint dot pins the hip only; the shoulder stays clean so the
  // torso meets the head as one line, not a blob
  el('circle',{cx:hx,cy:hy,r:3,fill:INK,stroke:'none'},g);
  // head: plain circle, never filtered, always round
  el('circle',{cx:J.head[0],cy:J.head[1],r:s.head,'stroke-width':3.4},g);
  return g;
}
// game view
const game=document.getElementById('game');
defs(game);
let T=0, playing=true, fps=13, scroll=0;
const W=640,H=300;
function frame(dt){
  if(playing){T+=dt*fps; scroll+=dt*260;}
  while(game.firstChild)game.removeChild(game.firstChild);
  defs(game);
  const gy=paper(game,W,H,scroll);
  const cx=200;
  const p=poseAt(T);
  // auto-ground: solve hip height so the lowest foot plants on (or flies above) the ground
  const [ii,ff]=segAt(T), n=KEYS.length;
  const clear=lerp(CLEAR[ii],CLEAR[(ii+1)%n],ff);
  let J0=joints({hipY:0,lean:p.lean,rT:p.rT,rK:p.rK,lT:p.lT,lK:p.lK,rS:p.rS,rE:p.rE,lS:p.lS,lE:p.lE},cx+p.hipX,gy-80);
  const low=Math.max(J0.r.f[1],J0.l.f[1]);
  const shift=(gy-clear)-low;
  const J=joints({hipY:0,lean:p.lean,rT:p.rT,rK:p.rK,lT:p.lT,lK:p.lK,rS:p.rS,rE:p.rE,lS:p.lS,lE:p.lE},cx+p.hipX,gy-80+shift);
  const hipY=gy-80+shift;
  const g=el('g',{},game);
  speedlines(g,cx-52,hipY-70,T%1);
  // shadow under hips, scales in flight
  const air=Math.min(1,Math.max(0,clear/12));
  el('ellipse',{cx:cx+6,cy:gy+12,rx:34-air*8,ry:5,fill:INK,opacity:.18- air*.08,stroke:'none'},game);
  drawFigure(game,{hip:[cx+p.hipX,hipY],sh:J.sh,head:J.head,r:J.r,l:J.l,ra:J.ra,la:J.la},L);
  // dust puff on contact keys
  if((ii===0||ii===4)&&playing){
    const f=ff;
    el('circle',{cx:cx+34,cy:gy-4-f*10,r:3+f*5,fill:'none',stroke:INK,'stroke-width':1.6,opacity:.5-f*.4},game);
  }
}
// keys strip
const keys=document.getElementById('keys');
defs(keys);
(function(){
  el('rect',{x:0,y:0,width:680,height:180,fill:PAPER},keys);
  const names=['R contact','R stance','L swing','L plant','L contact','L stance','R swing','R plant'];
  KEYS.forEach((p,i)=>{
    const cx=45+i*80, gy=150;
    el('text',{x:cx-26,y:16,fill:'#666','font-size':11,'font-family':'sans-serif',stroke:'none'},keys).textContent=(i+1)+' '+names[i];
    let J0=joints({hipY:0,lean:p.lean,rT:p.rT,rK:p.rK,lT:p.lT,lK:p.lK,rS:p.rS,rE:p.rE,lS:p.lS,lE:p.lE},cx+p.hipX,gy-60);
    const low=Math.max(J0.r.f[1],J0.l.f[1]);
    const hy=gy-60+((gy-CLEAR[i]*1.2)-low);
    const J=joints({hipY:0,lean:p.lean,rT:p.rT,rK:p.rK,lT:p.lT,lK:p.lK,rS:p.rS,rE:p.rE,lS:p.lS,lE:p.lE},cx+p.hipX,hy);
    el('line',{x1:cx-32,y1:gy,x2:cx+32,y2:gy,stroke:INK,'stroke-width':2.4,'stroke-linecap':'round'},keys);
    drawFigure(keys,{hip:[cx+p.hipX,hy],sh:J.sh,head:J.head,r:J.r,l:J.l,ra:J.ra,la:J.la},{head:10});
  });
})();
let last=performance.now();
(function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  frame(dt); requestAnimationFrame(loop);
})(last);
document.getElementById('fps').oninput=e=>{fps=+e.target.value;document.getElementById('fpsv').textContent=fps;};
window.hermes={send:m=>{if(m.includes('pause'))playing=false;if(m.includes('play'))playing=true;}};
</script>
</body></html>
