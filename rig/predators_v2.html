let playing=true, fps=9, acc=0, last=performance.now(), sc=0;
const hi=document.getElementById('hound'), bi=document.getElementById('bird');
function tick(now){
  const dt=(now-last)/1000; last=now;
  if(playing){
    acc+=dt*fps; sc+=dt*220;
    const k=Math.floor(acc);
    hi.src=Hframes[k%4]; bi.src=Bframes[(k%8<4)?k%4:(3-k%4)]; // bird ping-pongs: no snap back to dive
    document.getElementById('pebbles').style.backgroundPositionX=(-sc%96)+'px';
    // bird bobs: up on upstroke, down on glide
    bi.style.top=(30+((k%4===1)?-14:((k%4===3)?12:0)))+'px';
  }
  function stat(){
  const t=[];
  Hframes.forEach((u,i)=>{const im=new Image();im.onload=()=>t.push('H'+i+':ok');im.onerror=()=>t.push('H'+i+':FAIL');im.src=u;});
  Bframes.forEach((u,i)=>{const im=new Image();im.onload=()=>t.push('B'+i+':ok');im.onerror=()=>t.push('B'+i+':FAIL');im.src=u;});
  let n=0;const iv=setInterval(()=>{document.getElementById('stat').textContent='frames loaded: '+t.join(' ')+' | fps='+fps;if(++n>20)clearInterval(iv);},300);
}
stat();
requestAnimationFrame(tick);
}
hi.src=Hframes[0]; bi.src=Bframes[0];
function stat(){
  const t=[];
  Hframes.forEach((u,i)=>{const im=new Image();im.onload=()=>t.push('H'+i+':ok');im.onerror=()=>t.push('H'+i+':FAIL');im.src=u;});
  Bframes.forEach((u,i)=>{const im=new Image();im.onload=()=>t.push('B'+i+':ok');im.onerror=()=>t.push('B'+i+':FAIL');im.src=u;});
  let n=0;const iv=setInterval(()=>{document.getElementById('stat').textContent='frames loaded: '+t.join(' ')+' | fps='+fps;if(++n>20)clearInterval(iv);},300);
}
stat();
requestAnimationFrame(tick);
document.getElementById('pp').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';};
document.getElementById('fps').oninput=e=>{fps=+e.target.value;document.getElementById('fpsv').textContent=fps;};
